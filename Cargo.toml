[package]
name = "photo_sorter"
version = "0.1.0"
edition = "2024"
description = "Blazingly fast photo culling: browse, favourite into per-event sessions, sync to Google Drive."
publish = false

[[bin]]
name = "photo-sorter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui = { version = "0.37", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "bmp", "tiff", "jpeg"] }
fast_image_resize = "6"
kamadak-exif = "0.6"
natord = "1"
rayon = "1"
bytemuck = "1"
rfd = "0.17"
trash = "5"
opener = "0.9"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
jpeg-decoder = "0.3"
tempfile = "3"
zune-jpeg = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Decoders are unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
