[package]
name = "photo_sorter"
version = "0.1.0"
edition = "2024"
authors = ["Tudor Andrei-Cristian"]
description = "Blazingly fast photo culling: browse, favourite into per-event sessions, upload to Google Drive, OneDrive, Dropbox or WebDAV."
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "photo-sorter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "glow", "accesskit", "default_fonts", "persistence", "wayland", "x11"] }
egui = { version = "0.37", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
turbojpeg = { version = "1", default-features = false, features = ["cmake", "require-simd"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "bmp", "tiff", "jpeg"] }
fast_image_resize = "6"
kamadak-exif = "0.6"
natord = "1"
rayon = "1"
bytemuck = "1"
rfd = "0.17"
trash = "5"
opener = "0.9"
cargo-packager-updater = "0.2"
# Cloud uploads. reqwest 0.12 + rustls is what cargo-packager-updater already pulls in.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
sha2 = "0.10"
base64 = "0.22"

# Installers: `cargo build --release && cargo packager --release` (CI: .github/workflows/release.yml).
# Signing settings are injected by CI only, so local packaging works without certificates.
[package.metadata.packager]
product-name = "Photo Sorter"
identifier = "io.github.andrei399.photosorter"
publisher = "Tudor Andrei-Cristian"
homepage = "https://github.com/andrei399/photo-sorter"
# macOS needs a 1× icon; the 1024 px one only exists as 512@2x.
icons = ["assets/icon.png", "assets/icon@2x.png"]
category = "Photography"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
info-plist-path = "assets/macos/Info.plist"

# GPU drivers come from the system (Mesa or the vendor).
[package.metadata.packager.deb]
depends = ["libxkbcommon0", "libwayland-client0"]

[package.metadata.packager.pacman]
depends = ["libxkbcommon", "wayland"]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe", "wgpu", "snapshot"] }
jpeg-decoder = "0.3"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
zune-jpeg = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Decoders are unusably slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
